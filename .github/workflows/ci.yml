name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  install_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.14.2'

      - name: Cache Yarn and npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            ~/.npm
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Yarn
        run: npm install -g yarn@1.22.19

      - name: Install dependencies and bootstrap
        run: yarn kbn bootstrap

      - name: Build Kibana (docker images)
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}
        run: yarn build --docker-images --skip-os-packages --skip-docker-ubuntu

      - name: Prepare docker build context (copy kibana tar)
        run: |
          set -e
          BUILD_DIR=build/kibana-docker/default-ubi8
          mkdir -p "$BUILD_DIR"
          echo "Looking for kibana tar in target/ ..."
          TAR=$(ls -1t target/kibana-*-linux-*.tar.gz 2>/dev/null | head -n1 || true)
          if [ -n "$TAR" ]; then
            echo "Found tar: $TAR — copying to $BUILD_DIR"
            cp "$TAR" "$BUILD_DIR/$(basename $TAR)"
          else
            echo "ERROR: kibana tar not found in target/. Build may have failed. Listing target/:"
            ls -la target || true
            exit 1
          fi
          # Create a stable filename expected by the Dockerfile (CircleCI used this name)
          STABLE_NAME="kibana-8.2.4-SNAPSHOT-linux-x86_64.tar.gz"
          if [ ! -f "$BUILD_DIR/$STABLE_NAME" ]; then
            ln -sf "$BUILD_DIR/$(basename $TAR)" "$BUILD_DIR/$STABLE_NAME"
          fi
          echo "Build context contents:" && ls -la "$BUILD_DIR"

      - name: List build context before upload
        run: ls -la build/kibana-docker/default-ubi8 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kibana-docker
          path: build/kibana-docker/default-ubi8

      # Build and push image on protected branch only (same behavior as CircleCI)
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main-cst'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET }}
          aws-region: ${{ secrets.AWS_REGION_NAME }}

      - name: Build Docker image
        if: github.ref == 'refs/heads/main-cst'
        run: |
          cd build/kibana-docker/default-ubi8
          docker build -t 243606292720.dkr.ecr.eu-west-1.amazonaws.com/cst-kibana:latest .

      - name: Login to ECR
        if: github.ref == 'refs/heads/main-cst'
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION_NAME }} | docker login --username AWS --password-stdin 243606292720.dkr.ecr.eu-west-1.amazonaws.com/cst-kibana

      - name: Push image to ECR
        if: github.ref == 'refs/heads/main-cst'
        run: |
          docker push 243606292720.dkr.ecr.eu-west-1.amazonaws.com/cst-kibana:latest

  
